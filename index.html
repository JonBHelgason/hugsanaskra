<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hugsanaskrá">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hugsanaskrá</title>

<style>
/* ============ LITIR OG GRUNNSTILLINGAR (breyttu hér ef þú vilt annað útlit) ============ */
:root{
  --bg:#12161c;        /* bakgrunnur */
  --card:#1b222b;      /* spjöld */
  --line:#2a333f;      /* línur */
  --text:#e6e9ee;      /* texti */
  --muted:#8b96a5;     /* daufur texti */
  --accent:#7fb3d5;    /* aðallitur (hnappar) */
  --danger:#e07a7a;    /* eyða */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:26px;margin:8px 0 16px;font-weight:600}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.entry{cursor:pointer}
.entry .when{font-size:14px;color:var(--muted)}
.entry .snip{margin-top:4px}

/* ---- hnappar: stórir ---- */
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
  border-radius:14px;min-height:52px;padding:10px 16px;cursor:pointer}
button:active{opacity:.7}
.big{width:100%;font-size:19px;margin:8px 0}
.primary{background:var(--accent);color:#0d1319;border-color:var(--accent);font-weight:600}
.danger{color:var(--danger);border-color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}

/* ---- form ---- */
label{display:block;font-weight:600;margin:18px 0 6px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=datetime-local],input[type=date],textarea,select{
  width:100%;font:inherit;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}

/* ---- tilfinningar ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:22px;border:2px solid var(--c,#888);background:transparent}
.chip.on{background:var(--c,#888);color:#111;font-weight:600}
/* ---- tilfinningahjól: hringlaga niðurgröftur ---- */
.wmode{margin-bottom:10px}
.wmode button{min-height:40px}
#stage{position:relative;margin:6px auto;overflow:hidden}
#stage svg{position:absolute;left:0;top:0;pointer-events:none}
#stage line{stroke-width:2;opacity:.35}
.node{position:absolute;transform:translate(-50%,-50%) scale(.3);opacity:0;
  transition:left .35s ease,top .35s ease,opacity .3s ease,transform .35s ease;
  min-height:46px;padding:6px 14px;border-radius:24px;border:2px solid var(--c);
  background:var(--card);color:var(--text);white-space:nowrap;font-size:15px}
.node.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.node.base{background:var(--c);color:#111;font-weight:600;min-height:54px;padding:8px 18px;font-size:16px}
.node.mid{font-weight:600}
.node.on{background:var(--c);color:#111;font-weight:600}
.node i{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;
  background:var(--c);border:2px solid var(--bg)}
.hub{position:absolute;width:84px;height:84px;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:12px;line-height:1.2;padding:2px;overflow-wrap:anywhere;
  border:2px solid var(--c,var(--line));background:var(--card);color:var(--text);min-height:0}
button.hub{background:var(--c);color:#111;font-weight:700}
.hub.hint{color:var(--muted);font-size:13px;border-style:dashed}
/* skap-mælir: 4 litaðir reitir, orðin birtast undir völdum reit */
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.quad{min-height:92px;border-radius:16px;border:3px solid transparent;background:var(--c);color:#111;
  font-weight:600;font-size:17px;line-height:1.25;text-align:left;padding:12px;opacity:.5}
.quad small{display:block;font-weight:400;font-size:14px;margin-top:4px}
.quad.open{opacity:1;border-color:#fff}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sel{background:var(--card);border-left:6px solid var(--c);border-radius:12px;padding:8px 12px;margin:8px 0}
.sel .row{gap:6px}
.sel b{flex:1}
.sel .val{flex:0 0 auto;font-size:20px;font-weight:600;min-width:28px;text-align:right}
.sel button{flex:0 0 auto;min-height:40px;min-width:40px;padding:0}
.free{display:flex;gap:8px;margin-top:10px}
.free input{flex:1}
.free button{flex:0 0 auto}

/* ---- skref, merki, leit ---- */
[hidden]{display:none!important}
.steps{display:flex;gap:6px;margin:0 0 4px}
.steps button{flex:1;min-height:44px;padding:4px 2px;font-size:13px;color:var(--muted);line-height:1.2}
.steps button.on{color:var(--text);border-color:var(--accent);font-weight:600}
.steps button.done{color:var(--accent)}
.actions{margin-top:20px}
.actions .row{margin:8px 0}
.linkbtn{background:none;border:0;color:var(--muted);min-height:44px;text-decoration:underline;padding:0 4px;margin-top:8px}
.search{margin:6px 0 10px}
/* ---- vikuræma á forsíðu ---- */
.week{display:flex;gap:6px;margin:4px 0 12px}
.week .d{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.dayc{width:100%;aspect-ratio:1/1;min-height:40px;border-radius:50%;padding:0;margin-top:4px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:18px}
.dayc.has{background:var(--c);border-color:var(--c);color:#111}
.dayc.today{border:2px solid var(--accent)}
.dayc.future{opacity:.35}
/* ---- dagatal ---- */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead b{flex:1;text-align:center;font-size:18px;text-transform:capitalize}
.calhead button{flex:0 0 52px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;color:var(--muted);font-size:13px}
.cal button{aspect-ratio:1/1;min-height:40px;padding:0;border-radius:12px;font-size:15px;background:var(--card);border:1px solid var(--line)}
.cal button.has{background:var(--c);color:#111;border-color:var(--c);font-weight:600}
.cal button.today{border:2px solid var(--accent)}
.cal button.sel{outline:2px solid var(--text);outline-offset:1px}

/* ---- val: hjálpaði ---- */
.seg{display:flex;gap:8px}
.seg button{flex:1}
.seg button.on{background:var(--accent);color:#0d1319;border-color:var(--accent);font-weight:600}

/* ---- yfirsýn ---- */
.kpis{display:flex;gap:12px}
.kpis div{flex:1;text-align:center}
.kpis b{display:block;font-size:30px}
.kpis span{color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.bar .name{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;background:var(--line);border-radius:6px;height:14px;overflow:hidden}
.bar .fill{height:100%;background:var(--c,var(--accent))}
.bar .n{flex:0 0 auto;min-width:60px;text-align:right;color:var(--muted);font-size:14px}

/* ---- neðri valmynd ---- */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e1217;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:58px;font-size:14px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);
  background:#2d3947;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.save-bar{padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-a="nav" data-v="home">Heim</button>
  <button data-a="nav" data-v="list">Færslur</button>
  <button data-a="nav" data-v="cal">Dagatal</button>
  <button data-a="nav" data-v="stats">Yfirsýn</button>
  <button data-a="nav" data-v="data">Gögn</button>
</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* =====================================================================
   HUGSANASKRÁ – einföld thought record fyrir símann.
   Öll gögn vistast í localStorage í þessum síma. Ekkert er sent neitt.
   Skipulag skjalsins:
     1. TILFINNINGAR (skap-mælir, orðalisti – breyttu hér)
     2. GÖGN (hlaða/vista)
     3. HJÁLPARFÖLL
     4. SKJÁIR (heim, færslur, ný færsla, yfirsýn, gögn)
     5. AÐGERÐIR (hvað gerist þegar ýtt er á takka)
   ===================================================================== */

/* ---------- 1. TILFINNINGAR (skap-mælir eins og í How We Feel) ----------
   4 reitir: orka (mikil/lítil) x þægindi (óþægilegt/þægilegt).
   Orðin eru í sömu röð og á myndinni (lesið frá vinstri til hægri, efsta röð fyrst).
   Til að bæta við, breyta eða fjarlægja orð: breyttu "words" í viðkomandi reit. */
const QUADS = [
  {id:'rautt',  color:'#e8645f', title:'Mikil orka', sub:'óþægilegt', words:[
    'Bræði','Skelfing','Streita','Taugatitringur','Áfall',
    'Heift','Ofsareiði','Gremja','Spenna','Orðleysi',
    'Sjóðandi reiði','Hræðsla','Reiði','Taugaóstyrkur','Eirðarleysi',
    'Kvíði','Uggur','Áhyggjur','Ergelsi','Pirringur',
    'Viðbjóður','Hugarangur','Hugarvíl','Óróleiki','Fýla']},
  {id:'gult',   color:'#f4c542', title:'Mikil orka', sub:'þægilegt', words:[
    'Undrun','Léttleiki','Hátíðarskap','Hrifningarvíma','Alsæla',
    'Ofurorka','Kátína','Hvatning','Innblástur','Fögnuður',
    'Orka','Fjör','Spenningur','Bjartsýni','Eldmóður',
    'Ánægja','Einbeiting','Gleði','Stolt','Hrifning',
    'Notalegheit','Kæti','Von','Leikgleði','Sæla']},
  {id:'blatt',  color:'#5bb8ea', title:'Lítil orka', sub:'óþægilegt', words:[
    'Ógeð','Dapurleiki','Vonbrigði','Depurð','Áhugaleysi',
    'Svartsýni','Önuglyndi','Hugfall','Sorg','Leiði',
    'Firring','Volæði','Einmanaleiki','Kjarkleysi','Þreyta',
    'Hryggð','Þunglyndi','Fúllyndi','Örmögnun','Slen',
    'Örvænting','Vonleysi','Auðn','Uppgefni','Þróttleysi']},
  {id:'graent', color:'#7cc470', title:'Lítil orka', sub:'þægilegt', words:[
    'Náðugheit','Léttlyndi','Sátt','Ást','Lífsfylling',
    'Ró','Öryggi','Fullsæla','Þakklæti','Hrærsla',
    'Slökun','Afslöppun','Hvíld','Blessun','Jafnvægi',
    'Mildi','Íhugun','Friður','Vellíðan','Áhyggjuleysi',
    'Syfja','Værukærð','Kyrrð','Hlýja','Æðruleysi']}
];

/* TILFINNINGAHJÓLIÐ (hringurinn): grunntilfinning -> undirflokkur -> orð.
   Til að bæta við orði: settu það í "words" á réttum stað. */
const WHEEL = [
  {name:'Hamingja', color:'#fdfdc0', mids:[
    {name:'Ánægja',      words:['Gleði','Kátína']},
    {name:'Ró',          words:['Þakklæti','Sátt']},
    {name:'Áhugi',       words:['Forvitni','Hrifning']},
    {name:'Stolt',       words:['Sjálfstraust','Hreykni']},
    {name:'Viðurkenning',words:['Samþykki','Staðfesta']},
    {name:'Kraftur',     words:['Hugrekki','Sköpun']},
    {name:'Traust',      words:['Ást','Þakklæti']},
    {name:'Samkennd',    words:['Góðvild','Innileiki']},
    {name:'Bjartsýni',   words:['Eftirvænting','Von']}
  ]},
  {name:'Undrun', color:'#c9c9f5', mids:[
    {name:'Hissa',     words:['Forviða','Vonbrigði']},
    {name:'Ráðaleysi', words:['Svekkelsi','Ringlun']},
    {name:'Agndofa',   words:['Furða','Hneykslun']},
    {name:'Spenna',    words:['Ákefð','Kappsemi']}
  ]},
  {name:'Skömm', color:'#d2f7b8', mids:[
    {name:'Niðurlæging',words:['Feimni','Smán','Minnimáttarkennd','Höfnun','Vandræðalegt']},
    {name:'Sektarkennd',words:['Samviskubit','Auðmýkt']},
    {name:'Iðrun',      words:['Skammast','Eftirsjá']}
  ]},
  {name:'Ótti', color:'#fde0b0', mids:[
    {name:'Hræðsla', words:['Skelfing','Beygur']},
    {name:'Kvíði',   words:['Óró','Áhyggjur']},          /* á myndinni stendur "Óróí" – athugaðu */
    {name:'Ógnun',   words:['Óöryggi','Skelkun']},
    {name:'Álag',    words:['Taugaveiklun','Streita']}
  ]},
  {name:'Reiði', color:'#ffb8da', mids:[
    {name:'Vonbrigði',  words:['Sár','Móðgun']},
    {name:'Öfund',      words:['Afbrýðisemi','Öfundsýki']},
    {name:'Árásargirni',words:['Bræði','Æsingur']},
    {name:'Pirringur',  words:['Skapstyggð','Ergelsi']},
    {name:'Óánægja',    words:['Gremja','Biturð','Hneykslun']},
    {name:'Vanþóknun',  words:['Fyrirlitning','Dómharka']}
  ]},
  {name:'Viðbjóður', color:'#c4c4c4', mids:[
    {name:'Andúð',      words:['Andstyggð','Fyrirlitning']},
    {name:'Mislíka',    words:['Blöskra','Hatur']},
    {name:'Viðurstyggð',words:['Klígja','Óbeit','Ónot','Ógeð']}
  ]},
  {name:'Depurð', color:'#29a3e0', mids:[
    {name:'Þróttleysi',words:['Slen','Dugleysi']},
    {name:'Þjáning',   words:['Angist','Kvöl']},
    {name:'Örvænting', words:['Böl','Hjálparleysi','Vonleysi']},
    {name:'Sorg',      words:['Hryggð','Söknuður','Doði']},
    {name:'Leiði',     words:['Minnimáttarkennd','Einmannaleiki','Áhugaleysi']}
  ]}
];

/* Orð -> litur (til að lita sleða og súlur). Hjólið gengur fyrir, skap-mælirinn fyllir í eyður. */
const WORD_COLOR = {};
WHEEL.forEach(b=>{
  if(!WORD_COLOR[b.name]) WORD_COLOR[b.name]=b.color;
  b.mids.forEach(m=>{
    if(!WORD_COLOR[m.name]) WORD_COLOR[m.name]=b.color;
    m.words.forEach(w=>{ if(!WORD_COLOR[w]) WORD_COLOR[w]=b.color; });
  });
});
QUADS.forEach(q=> q.words.forEach(w=>{ if(!WORD_COLOR[w]) WORD_COLOR[w]=q.color; }));
const FREE_COLOR = '#9aa5b1';                       // litur fyrir frjálsan texta
const colorOf = w => WORD_COLOR[w] || FREE_COLOR;

/* MERKI (tags): sjálfgefin merki. Þú getur bætt við eigin merkjum með + í appinu.
   Til að breyta sjálfgefnum merkjum: breyttu "items" hér. */
const TAG_GROUPS = [
  {id:'stadur', title:'Staður',               items:['Heima','Vinna','Úti','Í bíl']},
  {id:'folk',   title:'Fólk',                 items:['Ein/n','Fjölskylda','Vinir','Vinnufélagar']},
  {id:'gera',   title:'Hvað ég var að gera',  items:['Vinna','Hvíld','Hreyfing','Matur']}
];

/* ---------- 2. GÖGN ---------- */
const KEY   = 'hugsanaskra_v1';        // færslurnar
const META  = 'hugsanaskra_meta';      // t.d. hvenær síðast var tekið afrit
const DRAFT = 'hugsanaskra_draft';     // ókláruð ný færsla (týnist ekki ef appinu er lokað)

function readJSON(k, fallback){
  try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; }
  catch(e){ return fallback; }
}
function writeJSON(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ toast('Tókst ekki að vista!'); }
}

let entries = readJSON(KEY, []);       // [{id,time,place,before,thought,alt,emotions:[{w,s}],did,helped}]
let meta    = readJSON(META, {});
const saveEntries = () => writeJSON(KEY, entries);
const saveMeta    = () => writeJSON(META, meta);

/* Biðja símann um að eyða ekki gögnunum sjálfkrafa (virkar ekki alls staðar, skaðar ekki) */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- 3. HJÁLPARFÖLL ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* Tími er geymdur sem staðartími: "2026-10-10T20:17" */
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateOnly = d => toLocalInput(d).slice(0,10);
const fmtTime = s => {
  const d = new Date(s);
  return d.toLocaleString('is-IS',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
};
const sorted = () => entries.slice().sort((a,b)=> b.time.localeCompare(a.time));   // nýjast efst
const inDays = (e, days) => (Date.now() - new Date(e.time)) <= days*86400000;

/* Meðalstyrkur */
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
const fmtNum = n => n===null ? '–' : (Math.round(n*10)/10).toString().replace('.',',');   // 6,2
const entryAvg = e => avg(e.emotions.map(x=>x.s));
const allAvg = list => avg(list.flatMap(e=>e.emotions.map(x=>x.s)));

let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ----- Orðatalning fyrir "algengustu kveikjur" -----
   Íslenska beygist (skóli, skólanum, skóla), svo við teljum á orðstofni = fyrstu 5 stafir.
   Þetta er gróft en nóg til að sjá mynstur. Bættu við STOP ef smáorð eru að trufla. */
const STOP = new Set(('og í á að var ég við með það sem til en um af hann hún þeir þau ekki voru fyrir frá eftir '+
  'vera verið hafði mig mér minn mín mínum sig sér svo þá þegar þar hér út inn upp niður eða ef því þetta þessi '+
  'þess hjá er hans hennar okkur þú þig þér þarf vil kom fór áður rétt bara mjög nú aðeins sá sú hef hafa hafði '+
  'sagði sagði fékk fæ vildi gat get verð varð voru eins samt alla allt allir engin enginn aftur strax þannig '+
  'þeirra þeim þeirri hvað hvernig hvar hver sem þar þarna líka bæði heldur eða nema fyrst').split(' '));
const STEM_LEN = 5;

function topWords(texts, n){
  const count = {};      // stofn -> fjöldi færslna
  const shown = {};      // stofn -> hvaða mynd orðsins kemur oftast fyrir (til að sýna)
  texts.forEach(t=>{
    const seen = new Set();
    (String(t||'').toLowerCase().match(/\p{L}+/gu) || []).forEach(w=>{
      if(w.length<4 || STOP.has(w)) return;
      const st = w.slice(0,STEM_LEN);
      if(seen.has(st)) return;          // telja hvert orð einu sinni í hverri færslu
      seen.add(st);
      count[st] = (count[st]||0)+1;
      shown[st] = shown[st] || {};
      shown[st][w] = (shown[st][w]||0)+1;
    });
  });
  return Object.keys(count)
    .map(st=>({
      word: Object.entries(shown[st]).sort((a,b)=>b[1]-a[1])[0][0],
      n: count[st]
    }))
    .filter(x=>x.n>=2)                   // aðeins orð sem koma fyrir oftar en einu sinni
    .sort((a,b)=>b.n-a.n).slice(0,n);
}

/* Lárétt súla */
function bars(rows, color){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return rows.map(r=>`
    <div class="bar" ${r.title?`title="${esc(r.title)}"`:''}>
      <div class="name">${esc(r.name)}</div>
      <div class="track"><div class="fill" style="width:${r.v/max*100}%;--c:${r.color||color||'var(--accent)'}"></div></div>
      <div class="n">${esc(r.label ?? r.v)}</div>
    </div>`).join('') || '<p class="muted">Ekki nóg af gögnum enn.</p>';
}

function backupBanner(){

  return `<div class="card"><b>Mundu eftir afriti</b><br><span class="muted">${meta.lastBackup?'Síðasta afrit er meira en mánaðargamalt.':'Þú hefur ekki tekið afrit enn.'}</span>

const dayEntries = key => entries.filter(e=>e.time.slice(0,10)===key);
function dayColor(key){
  const es = dayEntries(key); if(!es.length) return null;
  let best = null;
  es.forEach(e=>e.emotions.forEach(x=>{ if(!best || x.s>best.s) best = x; }));
  return best ? colorOf(best.w) : FREE_COLOR;
}

const MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
function viewCal(){
  const now = new Date(), today = dateOnly(now);
  if(!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const offset = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate();
  let cells = '<span></span>'.repeat(offset);
  for(let d=1; d<=n; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`, col = dayColor(key);
    cells += `<button class="${col?'has':''}${key===today?' today':''}${key===calSel?' sel':''}" style="--c:${col||'transparent'}" data-a="calDay" data-d="${key}">${d}</button>`;
  }
  let below = '';
  if(calSel){
    const es = dayEntries(calSel).sort((a,b)=>b.time.localeCompare(a.time));
    const title = new Date(calSel+'T12:00').toLocaleDateString('is-IS',{weekday:'long',day:'numeric',month:'long'});
    below = `<h2>${esc(title)}</h2>` + (es.length ? es.map(entryCard).join('') :
      '<p class="muted">Engar færslur þennan dag.</p>') +
      (calSel<=today ? `<button class="big" data-a="day" data-d="${calSel}">+ Skrá færslu þennan dag</button>` : '');
  }
  return `<h1>Dagatal</h1>
    <div class="calhead"><button data-a="calNav" data-d="-1">‹</button><b>${MONTHS[m]} ${y}</b><button data-a="calNav" data-d="1">›</button></div>
    <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>${below}`;
}

const norm = s => s.toLowerCase().replace(/ð/g,'d').replace(/þ/g,'th').replace(/æ/g,'ae').replace(/ö/g,'o')
                    .normalize('NFD').replace(/[̀-ͯ]/g,'');     // "kvidi" finnur "Kvíði"
function allWords(){
  const set = new Set();
  WHEEL.forEach(b=>{ set.add(b.name); b.mids.forEach(m=>{ set.add(m.name); m.words.forEach(w=>set.add(w)); }); });
  QUADS.forEach(q=>q.words.forEach(w=>set.add(w)));
  return [...set].sort((a,b)=>a.localeCompare(b,'is'));
}
function drawSearch(){
  const box = $('searchRes'), wheel = $('wheel'); if(!box || !wheel) return;
  const q = norm(searchQ.trim());
  if(!q){ box.hidden = true; wheel.hidden = false; return; }
  const res = allWords().filter(w=>norm(w).includes(q)).slice(0,40);
  wheel.hidden = true; box.hidden = false;
  box.innerHTML = res.length
    ? `<div class="words">${res.map(w=>`<button class="chip${isSel(w)?' on':''}" style="--c:${colorOf(w)}" data-a="pick" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`
    : '<p class="muted">Ekkert orð fannst. Þú getur skrifað eigið orð neðar.</p>';
}

/* ============ VAL Á TILFINNINGUM ============
   Tvö útlit (hnappar efst): "Hringur" (sjálfgefið) og "Skap-mælir" (4 litaðir reitir).
   Hringur: 7 grunntilfinningar í hring. Ýtt á eina -> hún fer í miðjuna og undirflokkarnir

   Hægt er að velja mörg orð, líka úr mismunandi greinum. */
const wheelMode = () => meta.wheelMode || 'circle';
const isSel = w => draft.emotions.some(e=>e.w===w);

function togglePick(w){

/* Uppfæra eftir að orð var valið/fjarlægt (án þess að teikna hringinn upp á nýtt) */

/* Takki undir hringnum: velja grunntilfinninguna/undirflokkinn sjálfan sem tilfinningu */
function drawInfo(){

  const cur = wMid || wBase;
  if(!cur){ el.innerHTML = '<p class="muted" style="text-align:center;margin:4px 0">Ýttu á tilfinningu til að opna hana.</p>'; return; }
  const on = isSel(cur);
  el.innerHTML = `<button class="big${on?' primary':''}" data-a="pickCur">${
    on ? '✓ „'+esc(cur)+'“ valið – ýttu til að fjarlægja' : '+ Velja „'+esc(cur)+'“ sjálft'}</button>`;
}
/* Teikna hringinn. Staðsetning er reiknuð í pixlum:
   rx/ry = hálfásar sporbaugs, zigzag-stuðullinn (0,82) færir annað hvert atriði nær miðju
   svo löng orð skarist ekki. Breyttu tölunum ef þú vilt annað bil. */
function drawStage(){
  const st = $('stage'); if(!st) return;
  const base = WHEEL.find(b=>b.name===wBase);
  const mid  = base && base.mids.find(m=>m.name===wMid);
  const count = !base ? WHEEL.length : (!mid ? base.mids.length : mid.words.length);
  const W = Math.min($('wheel').clientWidth || 340, 460), H = Math.round(W*(count>7 ? 1.3 : count>5 ? 1.2 : 1.1));
  st.style.width = W+'px'; st.style.height = H+'px';
  const cx = W/2, cy = H/2;

  let items, hub;
  if(!base){
    items = WHEEL.map(b=>({label:b.name, key:b.name, kind:'base', color:b.color,
      has: b.mids.some(m=>isSel(m.name) || m.words.some(isSel)) || isSel(b.name)}));
    hub = `<div class="hub hint" style="left:${cx}px;top:${cy}px">Veldu tilfinningu</div>`;
  }else if(!mid){
    items = base.mids.map(m=>({label:m.name, key:m.name, kind:'mid', color:base.color,
      has: isSel(m.name) || m.words.some(isSel)}));
    hub = `<button class="hub" data-a="wback" style="--c:${base.color};left:${cx}px;top:${cy}px">‹ ${esc(base.name)}</button>`;
  }else{
    items = mid.words.map(w=>({label:w, key:w, kind:'word', color:base.color, on:isSel(w)}));
    hub = `<button class="hub" data-a="wback" style="--c:${base.color};left:${cx}px;top:${cy}px">‹ ${esc(mid.name)}</button>`;
  }

  st.innerHTML = `<svg width="${W}" height="${H}"></svg>` + hub + items.map(it =>
    `<button class="node ${it.kind}${it.on?' on':''}" data-a="node" data-kind="${it.kind}" data-k="${esc(it.key)}"
      style="--c:${it.color};left:${cx}px;top:${cy}px">${esc(it.label)}${it.has?'<i></i>':''}</button>`).join('');

  /* mæla breidd hvers hnapps og finna lokastöðu */
  const nodes = [...st.querySelectorAll('.node')], n = nodes.length;
  const rx = W*0.34, ry = H*0.37;
  const sz = nodes.map(nd=>({w:nd.offsetWidth, h:nd.offsetHeight}));
  const pos = nodes.map((nd,i)=>{
    const a = (-90 + i*360/n) * Math.PI/180;            // byrjar efst, raðað réttsælis
    const f = (n>=6 && i%2===1) ? 0.82 : 1;              // annað hvert atriði nær miðju
    return {x: cx + Math.cos(a)*rx*f, y: cy + Math.sin(a)*ry*f};
  });
  /* Ýta atriðum í sundur þar til ekkert skarast (og ekkert er ofan á miðjunni eða út af brún) */
  const GAP = 6, HUB_R = 42;
  for(let it=0; it<120; it++){
    let moved = false;
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx = pos[j].x-pos[i].x, dy = pos[j].y-pos[i].y;
      const ox = (sz[i].w+sz[j].w)/2 + GAP - Math.abs(dx);
      const oy = (sz[i].h+sz[j].h)/2 + GAP - Math.abs(dy);
      if(ox>0 && oy>0){
        moved = true;
        if(ox<oy){ const sg = dx>=0?1:-1; pos[i].x -= sg*ox/2; pos[j].x += sg*ox/2; }
        else     { const sg = dy>=0?1:-1; pos[i].y -= sg*oy/2; pos[j].y += sg*oy/2; }
      }
    }
    for(let i=0;i<n;i++){
      const hw=sz[i].w/2, hh=sz[i].h/2;
      const nx = Math.max(pos[i].x-hw, Math.min(cx, pos[i].x+hw));   // næsti punktur á hnappnum við miðju
      const ny = Math.max(pos[i].y-hh, Math.min(cy, pos[i].y+hh));
      const d = Math.hypot(nx-cx, ny-cy), need = HUB_R + GAP;
      if(d<need){
        moved = true;
        let vx = pos[i].x-cx, vy = pos[i].y-cy; const L = Math.hypot(vx,vy) || 1;
        pos[i].x += vx/L*(need-d+1); pos[i].y += vy/L*(need-d+1);
      }
      const px = Math.max(hw+2, Math.min(W-hw-2, pos[i].x)), py = Math.max(hh+2, Math.min(H-hh-2, pos[i].y));
      if(px!==pos[i].x || py!==pos[i].y){ pos[i].x=px; pos[i].y=py; moved = true; }
    }
    if(!moved) break;
  }
  st.querySelector('svg').innerHTML = pos.map((p,i)=>
    `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${items[i].color}"/>`).join('');

  /* hreyfing: atriðin renna úr miðjunni á sinn stað */
  requestAnimationFrame(()=>requestAnimationFrame(()=>nodes.forEach((nd,i)=>{
    nd.style.left = pos[i].x+'px'; nd.style.top = pos[i].y+'px'; nd.classList.add('show');
  })));
  drawInfo();
}

/* Skap-mælir: 1) ýttu á reit sem passar, 2) veldu orð (hægt að velja mörg, líka úr öðrum reitum) */

function renderHelped(){

/* ----- Yfirsýn ----- */
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6)%7));      // mánudagur
  return x;
}
function viewStats(){
  /* Færslur á viku: síðustu 8 vikur */
  const thisMon = mondayOf(new Date()), weeks = [];
  for(let i=7;i>=0;i--){
    const m = new Date(thisMon); m.setDate(m.getDate()-7*i);
    weeks.push({m, key:dateOnly(m), n:0});
  }
  entries.forEach(e=>{
    const k = dateOnly(mondayOf(new Date(e.time)));
    const w = weeks.find(x=>x.key===k); if(w) w.n++;
  });

  /* Tímabilið sem valið er */
  const list = statsDays===0 ? entries : entries.filter(e=>inDays(e,statsDays));

  /* Tilfinningar: fjöldi + meðalstyrkur á hverja */
  const emo = {};
  list.forEach(e=>e.emotions.forEach(x=>{
    (emo[x.w] = emo[x.w] || {n:0, sum:0}); emo[x.w].n++; emo[x.w].sum += x.s;
  }));
  const emoRows = Object.entries(emo).sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([w,o])=>({
    name:w, v:o.n, color:colorOf(w), label:`${o.n}× · ø ${fmtNum(o.sum/o.n)}`
  }));

  /* Kveikjur = algeng orð í "Hvað gerðist rétt áður" */
  const trig = topWords(list.map(e=>e.before), 8).map(x=>({name:x.word, v:x.n, label:x.n+'×'}));

  /* Hvað hjálpaði: hlutfall + algeng orð í "Hvað ég gerði" þegar svarið var já/smá */
  const h = {já:0, smá:0, nei:0};
  list.forEach(e=>{ if(h[e.helped]!==undefined) h[e.helped]++; });
  const helpedAnswers = h.já+h.smá+h.nei;
  const helpWords = topWords(list.filter(e=>e.helped==='já'||e.helped==='smá').map(e=>e.did), 8)
    .map(x=>({name:x.word, v:x.n, label:x.n+'×'}));

  /* Merki: fjöldi færslna og meðalstyrkur fyrir hvert merki */
  const tagBlocks = TAG_GROUPS.map(g=>{
    const m = {};
    list.forEach(e=>{
      const l = g.id==='stadur' ? placeList(e) : tagsOf(e,g.id), a = entryAvg(e);
      l.forEach(t=>{ (m[t] = m[t] || {n:0,s:0,k:0}); m[t].n++; if(a!==null){ m[t].s += a; m[t].k++; } });
    });
    const rows = Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,6).map(([t,o])=>({
      name:t, v:o.n, label:`${o.n}× · ø ${fmtNum(o.k ? o.s/o.k : null)}`}));
    return rows.length ? `<p class="muted" style="margin:10px 0 4px">${g.title}</p>${bars(rows)}` : '';
  }).join('');

  return `<h1>Yfirsýn</h1>
    <select data-change="statsDays">
      ${[[7,'Síðustu 7 dagar'],[30,'Síðustu 30 dagar'],[90,'Síðustu 90 dagar'],[0,'Allt']].map(([v,t])=>
        `<option value="${v}"${statsDays===v?' selected':''}>${t}</option>`).join('')}
    </select>

    <div class="card"><div class="kpis">
      <div><b>${list.length}</b><span>færslur</span></div>
      <div><b>${fmtNum(allAvg(list))}</b><span>meðalstyrkur (0–10)</span></div>
    </div></div>

    <h2>Færslur á viku</h2>
    <div class="card">${bars(weeks.map(w=>({
      name: `${w.m.getDate()}.${w.m.getMonth()+1}.`, v:w.n, label:w.n, title:'Vika frá '+w.key})))}</div>

    <h2>Algengustu tilfinningar</h2>
    <div class="card">${bars(emoRows)}</div>

    <h2>Merki: fjöldi og meðalstyrkur</h2>
    <div class="card">${tagBlocks || '<p class="muted">Merktu færslur (skref 2) til að sjá þetta.</p>'}</div>

    <h2>Algengustu kveikjur</h2>
    <div class="card">${bars(trig)}
      <p class="muted" style="font-size:14px;margin:8px 0 0">Orð sem koma oft fyrir í „Hvað gerðist rétt áður“. Gróf talning.</p></div>

    <h2>Hvað hjálpaði</h2>
    <div class="card">
      ${helpedAnswers ? bars([
        {name:'Já', v:h.já, label:h.já}, {name:'Smá', v:h.smá, label:h.smá}, {name:'Nei', v:h.nei, label:h.nei}
      ]) : '<p class="muted">Merktu „Hjálpaði það?“ í færslum til að sjá þetta.</p>'}
      ${helpWords.length?`<p class="muted" style="margin:12px 0 4px">Algeng orð þegar það hjálpaði (já/smá):</p>${bars(helpWords)}`:''}
    </div>`;
}

/* ----- Gögn: útflutningur, afrit, innflutningur ----- */
function viewData(){
  if(!exTo){ const d=new Date(); exTo=dateOnly(d); d.setDate(d.getDate()-14); exFrom=dateOnly(d); }

    <div class="card">
      <div class="row">
        <div><label for="ex_from" style="margin-top:0">Frá</label><input type="date" id="ex_from" value="${exFrom}"></div>
        <div><label for="ex_to" style="margin-top:0">Til</label><input type="date" id="ex_to" value="${exTo}"></div>
      </div>

      <p class="muted" style="font-size:14px">Á símanum opnast deilingarvalmynd. CSV notar semíkommu og UTF-8, svo íslenskir stafir opnast rétt í Excel.</p>
    </div>

    <h2>Afrit og innflutningur</h2>
    <div class="card">
      <p style="margin-top:0">${entries.length} færslur í símanum.<br>

      <button class="big" data-a="backup">Taka afrit (JSON)</button>
      <button class="big" data-a="importPick">Lesa inn afrit</button>
      <p class="muted" style="font-size:14px">Innlestur bætir við færslum sem vantar. Núverandi færslum er ekki eytt.</p>
    </div>`;
}

/* ---------- 5. AÐGERÐIR ---------- */

/* Deila skrá (deilingarvalmynd á síma) eða sækja hana (tölva) */
async function shareOrDownload(name, mime, text){
  const file = new File([text], name, {type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }
    catch(e){ if(e.name==='AbortError') return; }      // hætt við -> gera ekkert
  }
  const url = URL.createObjectURL(new Blob([text],{type:mime}));
  const a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* Færslur á völdu tímabili, elsta fyrst (hentar vel í lestri) */
function rangeEntries(){
  exFrom = $('ex_from').value; exTo = $('ex_to').value;
  return entries.filter(e=>{ const d=e.time.slice(0,10); return d>=exFrom && d<=exTo; })
                .sort((a,b)=>a.time.localeCompare(b.time));
}
const fmtEmo = e => e.emotions.map(x=>`${x.w} (${x.s}/10)`).join(', ');

function exportTxt(){
  const list = rangeEntries();
  if(!list.length) return toast('Engar færslur á þessu tímabili');
  let t = `HUGSANASKRÁ\nTímabil: ${exFrom} – ${exTo}\nFjöldi færslna: ${list.length}\n`;
  list.forEach(e=>{
    t += `\n--- ${fmtTime(e.time)} ---\n`;
    if(placeList(e).length)      t += `Staður: ${placeList(e).join(', ')}\n`;
    if(tagsOf(e,'folk').length)  t += `Fólk: ${tagsOf(e,'folk').join(', ')}\n`;
    if(tagsOf(e,'gera').length)  t += `Hvað ég var að gera: ${tagsOf(e,'gera').join(', ')}\n`;
    if(e.before)  t += `Rétt áður: ${e.before}\n`;
    if(e.thought) t += `Hugsun: ${e.thought}\n`;
    if(e.alt)     t += `Annað sjónarhorn: ${e.alt}\n`;
    if(e.emotions.length) t += `Tilfinningar: ${fmtEmo(e)}\n`;
    if(e.did)     t += `Hvað ég gerði: ${e.did}\n`;
    if(e.helped)  t += `Hjálpaði það: ${e.helped}\n`;
  });
  shareOrDownload(`hugsanaskra_${exFrom}_${exTo}.txt`, 'text/plain', t);
}
function exportCsv(){
  const list = rangeEntries();
  if(!list.length) return toast('Engar færslur á þessu tímabili');
  const q = s => '"' + String(s ?? '').replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
  const head = ['Tími','Staður','Fólk','Hvað ég var að gera','Rétt áður','Hugsun','Annað sjónarhorn','Tilfinningar','Meðalstyrkur','Hvað ég gerði','Hjálpaði'];
  const rows = list.map(e=>[
    e.time.replace('T',' '), placeList(e).join(', '), tagsOf(e,'folk').join(', '), tagsOf(e,'gera').join(', '), e.before, e.thought, e.alt, fmtEmo(e),
    fmtNum(entryAvg(e)), e.did, e.helped
  ].map(q).join(';'));
  const csv = '\ufeff' + [head.map(q).join(';'), ...rows].join('\r\n');   // \ufeff = UTF-8 BOM fyrir Excel
  shareOrDownload(`hugsanaskra_${exFrom}_${exTo}.csv`, 'text/csv;charset=utf-8', csv);
}
function backup(){
  const data = {app:'hugsanaskra', version:1, exported:new Date().toISOString(), entries};
  meta.lastBackup = new Date().toISOString(); saveMeta();
  shareOrDownload(`hugsanaskra_afrit_${dateOnly(new Date())}.json`, 'application/json', JSON.stringify(data,null,2));
  setTimeout(render, 300);
}
/* Hreinsa innflutta færslu svo hún brjóti ekki appið */
const arr = a => Array.isArray(a) ? a.map(String) : [];
function cleanEntry(e){
  return {
    id: String(e.id || newId()), time: String(e.time || toLocalInput(new Date())),
    place:String(e.place||''), before:String(e.before||''), thought:String(e.thought||''),
    alt:String(e.alt||''), did:String(e.did||''),
    helped: ['já','smá','nei'].includes(e.helped) ? e.helped : '',
    tags: {stadur:arr(e.tags&&e.tags.stadur), folk:arr(e.tags&&e.tags.folk), gera:arr(e.tags&&e.tags.gera)},
    emotions: Array.isArray(e.emotions) ? e.emotions.map(x=>({w:String(x.w), s:Math.min(10,Math.max(0,+x.s||0))})) : []
  };
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.entries)) throw new Error();
      const have = new Set(entries.map(e=>e.id));
      const add = d.entries.map(cleanEntry).filter(e=>!have.has(e.id));
      if(!confirm(`Bæta við ${add.length} færslum? (${d.entries.length-add.length} eru þegar til)`)) return;
      entries = entries.concat(add); saveEntries(); toast('Innlestri lokið'); render();
    }catch(e){ toast('Skráin er ekki gilt afrit'); }
  };
  r.readAsText(file);
}

/* Ókláruð færsla vistast sjálfkrafa */
const saveDraft = () => { if(!entries.some(e=>e.id===draft.id)) writeJSON(DRAFT, draft); };

/* Allir takkar fara í gegnum data-a="nafn" */
const actions = {
  nav:   t => go(t.dataset.v),
  new:   () => { draft = fixDraft(readJSON(DRAFT, null) || newDraft()); openQuad=null; wBase=wMid=null; go('form'); },
  open:  t => go('detail', t.dataset.id),
  edit:  t => { draft = fixDraft(JSON.parse(JSON.stringify(entries.find(e=>e.id===t.dataset.id)))); openQuad=null; wBase=wMid=null; go('form'); },
  del:   t => { if(confirm('Eyða þessari færslu?')){ entries = entries.filter(e=>e.id!==t.dataset.id); saveEntries(); toast('Færslu eytt'); go('list'); } },
  cancel:() => { if(confirm('Hætta við? Færslan vistast ekki.')){ localStorage.removeItem(DRAFT); go('home'); } },
  save:  () => {
    if(!draft.thought.trim() && !draft.before.trim() && !draft.emotions.length) return toast('Fylltu út eitthvað fyrst');
    const i = entries.findIndex(e=>e.id===draft.id);
    if(i>=0) entries[i]=draft; else entries.push(draft);
    saveEntries(); localStorage.removeItem(DRAFT); toast('Vistað'); go('home');
  },
  /* skref og merki */
  step:  t => { step = +t.dataset.n; drawSteps(); window.scrollTo(0,0); },
  tag:   t => {
    const l = draft.tags[t.dataset.g], i = l.indexOf(t.dataset.t);
    if(i>=0) l.splice(i,1); else l.push(t.dataset.t);
    renderTags(); saveDraft();
  },
  tagAdd:t => {
    const g = t.dataset.g, n = (prompt('Nýtt merki:') || '').trim().slice(0,30);
    if(!n) return;
    meta.customTags = meta.customTags || {}; meta.customTags[g] = meta.customTags[g] || [];
    if(!allTags(g).includes(n)){ meta.customTags[g].push(n); saveMeta(); }
    if(!draft.tags[g].includes(n)) draft.tags[g].push(n);
    renderTags(); saveDraft();
  },
  tagDel:t => {
    const g = t.dataset.g, n = t.dataset.t;
    meta.customTags[g] = (meta.customTags[g] || []).filter(x=>x!==n); saveMeta();
    draft.tags[g] = draft.tags[g].filter(x=>x!==n);
    renderTags(); saveDraft();
  },
  tagEdit: () => { tagEdit = !tagEdit; renderTags(); },
  /* vikuræma og dagatal */
  day:   t => {
    const key = t.dataset.d, today = dateOnly(new Date());
    if(key>today) return;
    if(dayEntries(key).length && view==='home'){ calMonth = new Date(key+'T12:00'); calMonth.setDate(1); calSel = key; return go('cal'); }
    draft = newDraft();
    if(key!==today) draft.time = key+'T12:00';
    openQuad = null; wBase = wMid = null; go('form');
  },
  calNav:t => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+(+t.dataset.d), 1); render(); },
  calDay:t => { calSel = t.dataset.d; render(); },
  toggleQuad: t => { openQuad = openQuad===t.dataset.b ? null : t.dataset.b; renderWheel(); },
  pick:  t => togglePick(t.dataset.w),                  // skap-mælir
  unpick:t => { draft.emotions = draft.emotions.filter(e=>e.w!==t.dataset.w); renderSelected(); refreshWheel(); saveDraft(); },
  addFree:() => {
    const w = $('f_free').value.trim(); if(!w) return;
    if(!draft.emotions.some(e=>e.w===w)) draft.emotions.push({w, s:5});
    $('f_free').value=''; renderSelected(); refreshWheel(); saveDraft();
  },
  /* hringur */
  node:  t => {
    const k = t.dataset.k, kind = t.dataset.kind;
    if(kind==='base'){ wBase = k; drawStage(); }
    else if(kind==='mid'){ wMid = k; drawStage(); }
    else togglePick(k);
  },
  wback:    () => { if(wMid) wMid = null; else wBase = null; drawStage(); },
  pickCur:  () => togglePick(wMid || wBase),
  wheelMode:t => { meta.wheelMode = t.dataset.m; saveMeta(); renderWheel(); },
  help:  t => { draft.helped = draft.helped===t.dataset.v ? '' : t.dataset.v; renderHelped(); saveDraft(); },
  exportTxt, exportCsv, backup,
  importPick: () => $('importFile').click()
};
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]');
  if(t && actions[t.dataset.a]) actions[t.dataset.a](t);
});

/* Texti og sleðar í forminu */
document.addEventListener('input', e=>{
  const t = e.target;
  if(view!=='form') return;
  if(t.id==='f_search'){ searchQ = t.value; drawSearch(); return; }
  if(t.id && t.id.startsWith('f_') && t.id!=='f_free'){
    draft[t.id.slice(2)] = t.value; saveDraft();
  }else if(t.type==='range'){
    const em = draft.emotions.find(x=>x.w===t.dataset.w);
    if(em){ em.s = +t.value; t.closest('.sel').querySelector('.val').textContent = t.value; saveDraft(); }
  }
});
/* Val í fellilistum */
document.addEventListener('change', e=>{
  if(e.target.dataset.change==='statsDays'){ statsDays=+e.target.value; render(); }
});
$('importFile').addEventListener('change', e=>{
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value='';
});

/* Teikna hringinn aftur ef breidd skjásins breytist (t.d. síminn snúinn) */
let lastW = 0, rzTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(rzTimer);
  rzTimer = setTimeout(()=>{
    if(view!=='form' || step!==1 || wheelMode()!=='circle' || !$('wheel')) return;
    const w = $('wheel').clientWidth;
    if(w!==lastW){ lastW = w; drawStage(); }
  }, 200);
});

/* ---------- Ræsing ---------- */
render();
/* Þjónustuskrá = appið virkar án nets */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
